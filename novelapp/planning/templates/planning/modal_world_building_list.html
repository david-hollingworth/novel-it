<!-- Modal: World Building List -->
<div class="space-y-4">
    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <h2 class="text-xl font-bold text-slate-900">World Building</h2>
        <button type="button"
            hx-get="{% url 'modal_world_building_create' novel.pk %}"
            hx-target="#planning-modal-content"
            class="px-3 py-1.5 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 cursor-pointer">
            + Add Item
        </button>
    </div>

    {% if world_building_items %}
    <div id="modal-world-building-list" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        {% for item in world_building_items %}
        <div data-id="{{ item.pk }}"
            class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-200">
            <div class="wb-drag-handle p-4 cursor-move">
                <div class="flex items-start justify-between mb-0.5">
                    <h3 class="text-sm font-bold text-slate-900 truncate">
                        <a href="#"
                            hx-get="{% url 'modal_world_building_edit' novel.pk item.pk %}"
                            hx-target="#planning-modal-content"
                            class="hover:text-indigo-600">{{ item.name }}</a>
                    </h3>
                    <svg class="flex-shrink-0 h-4 w-4 text-slate-300 ml-2" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M4 6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm8-7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
                    </svg>
                </div>
                {% if item.type %}
                <p class="text-xs text-indigo-600">{{ item.type.name }}</p>
                {% endif %}
                {% if item.image %}
                <img src="{{ item.image.url }}" alt="{{ item.name }}"
                    class="w-full h-24 object-cover mt-3 rounded-md">
                {% else %}
                <div class="w-full h-24 bg-slate-50 flex items-center justify-center mt-3 rounded-md">
                    <svg class="h-8 w-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                {% endif %}
                <div class="mt-1 pt-1 border-t border-slate-100 flex items-center justify-between">
                    <a href="#"
                        hx-get="{% url 'modal_world_building_edit' novel.pk item.pk %}"
                        hx-target="#planning-modal-content"
                        class="px-2 py-1 text-xs font-medium text-slate-700 bg-white rounded-md hover:text-indigo-600 border border-slate-200 hover:border-indigo-300">Edit</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-16 text-slate-400">
        <svg class="mx-auto h-12 w-12 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-sm">No world building items yet.</p>
    </div>
    {% endif %}
</div>

<script>
(function () {
    var el = document.getElementById('modal-world-building-list');
    if (el && typeof Sortable !== 'undefined') {
        Sortable.create(el, {
            animation: 150,
            ghostClass: 'bg-indigo-50',
            handle: '.wb-drag-handle',
            onEnd: function () {
                var order = [];
                el.querySelectorAll('[data-id]').forEach(function (item) {
                    order.push(item.dataset.id);
                });
                fetch("{% url 'world_building_reorder' novel.pk %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                    body: JSON.stringify({ world_building_ids: order })
                }).then(function (r) {
                    if (!r.ok) console.error('World building reorder failed');
                });
            }
        });
    }
})();
</script>
