<!-- Modal: Location List -->
<div class="space-y-4">
    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <h2 class="text-xl font-bold text-slate-900">Locations</h2>
        <button type="button"
            hx-get="{% url 'modal_location_create' novel.pk %}"
            hx-target="#planning-modal-content"
            class="px-3 py-1.5 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 cursor-pointer">
            + Add Location
        </button>
    </div>

    {% if locations %}
    <div id="modal-location-list" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        {% for location in locations %}
        <div data-id="{{ location.pk }}"
            class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-200">
            <div class="location-drag-handle p-4 cursor-move">
                <div class="flex items-start justify-between mb-0.5">
                    <h3 class="text-sm font-bold text-slate-900 truncate">
                        <a href="#"
                            hx-get="{% url 'modal_location_edit' novel.pk location.pk %}"
                            hx-target="#planning-modal-content"
                            class="hover:text-indigo-600">{{ location.name }}</a>
                    </h3>
                    <svg class="flex-shrink-0 h-4 w-4 text-slate-300 ml-2" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M4 6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm8-7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
                    </svg>
                </div>
                {% if location.type %}
                <p class="text-xs text-indigo-600">{{ location.type.name }}</p>
                {% endif %}
                {% if location.image %}
                <img src="{{ location.image.url }}" alt="{{ location.name }}"
                    class="w-full h-24 object-cover mt-3 rounded-md">
                {% else %}
                <div class="w-full h-24 bg-emerald-50 flex items-center justify-center mt-3 rounded-md">
                    <svg class="h-8 w-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                {% endif %}
                <div class="mt-1 pt-1 border-t border-slate-100 flex items-center justify-between">
                    <a href="#"
                        hx-get="{% url 'modal_location_edit' novel.pk location.pk %}"
                        hx-target="#planning-modal-content"
                        class="px-2 py-1 text-xs font-medium text-slate-700 bg-white rounded-md hover:text-indigo-600 border border-slate-200 hover:border-indigo-300">Edit</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-16 text-slate-400">
        <svg class="mx-auto h-12 w-12 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        </svg>
        <p class="text-sm">No locations yet.</p>
    </div>
    {% endif %}
</div>

<script>
(function () {
    var el = document.getElementById('modal-location-list');
    if (el && typeof Sortable !== 'undefined') {
        Sortable.create(el, {
            animation: 150,
            ghostClass: 'bg-indigo-50',
            handle: '.location-drag-handle',
            onEnd: function () {
                var order = [];
                el.querySelectorAll('[data-id]').forEach(function (item) {
                    order.push(item.dataset.id);
                });
                fetch("{% url 'location_reorder' novel.pk %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                    body: JSON.stringify({ location_ids: order })
                }).then(function (r) {
                    if (!r.ok) console.error('Location reorder failed');
                });
            }
        });
    }
})();
</script>
