<!-- Modal: World Building Detail -->
<div class="space-y-6">
    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <div class="flex items-center gap-3">
            <button type="button"
                hx-get="{% url 'modal_world_building_list' novel.pk %}"
                hx-target="#planning-modal-content"
                class="text-slate-400 hover:text-indigo-600 cursor-pointer">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </button>
            <h2 class="text-xl font-bold text-slate-900">{{ item.name }}</h2>
        </div>
        <button type="button"
            hx-get="{% url 'modal_world_building_edit' novel.pk item.pk %}"
            hx-target="#planning-modal-content"
            class="px-3 py-1.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50 cursor-pointer">
            Edit
        </button>
    </div>

    {% if item.image %}
    <img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-full h-48 object-cover rounded-lg">
    {% endif %}

    {% if item.type %}
    <p class="text-sm font-medium text-indigo-600">{{ item.type.name }}</p>
    {% endif %}

    {% if item.description %}
    <div>
        <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-2">Description</h3>
        <div class="text-sm text-slate-700 user-content">{{ item.description|linebreaks }}</div>
    </div>
    {% endif %}

    {% if item.notes %}
    <div>
        <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-2">Notes</h3>
        <div class="text-sm text-slate-700 user-content">{{ item.notes|linebreaks }}</div>
    </div>
    {% endif %}
</div>
