{% extends 'base.html' %}

{% block title %}Unarchive {{ novel.title }} - Novel It{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white p-8 rounded-lg border border-slate-200 shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">Unarchive Novel</h1>
        <p class="text-slate-600 mb-8">
            Are you sure you want to unarchive <span class="font-bold text-slate-900">"{{ novel.title }}"</span>?
            This will restore it to your main list of novels.
        </p>
        <form method="POST">
            {% csrf_token %}
            <div class="flex justify-end space-x-3">
                <a href="{% url 'archived_novel_list' %}"
                    class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50">Cancel</a>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md hover:bg-indigo-700">
                    Yes, Unarchive Novel
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
