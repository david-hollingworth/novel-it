{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto mt-10">
    <div class="bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-slate-800 mb-4">Archive Scene?</h2>
        <p class="text-slate-600 mb-6">
            Are you sure you want to archive the scene <strong>"{{ scene.title }}"</strong>?
            This will hide it from the chapter view, but you can restore it later.
        </p>

        <form method="post" class="flex items-center space-x-4">
            {% csrf_token %}
            <button type="submit"
                class="px-4 py-2 bg-yellow-600 text-white rounded-md hover:bg-yellow-700 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2">
                Yes, Archive Scene
            </button>
            <a href="{% url 'chapter_detail' novel.pk chapter.pk %}"
                class="px-4 py-2 bg-slate-200 text-slate-700 rounded-md hover:bg-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
