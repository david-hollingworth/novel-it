{% extends 'base.html' %}

{% block title %}Dashboard - Novel It{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-slate-900">Your Novels</h1>
        <a href="#"
            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
            Create New Novel
        </a>
    </div>

    <div class="bg-white shadow overflow-hidden sm:rounded-md border border-slate-200">
        <div class="p-12 text-center text-slate-500">
            <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
            <h3 class="mt-2 text-sm font-medium text-slate-900">No novels yet</h3>
            <p class="mt-1 text-sm text-slate-500">Get started by creating your first novel.</p>
        </div>
    </div>
</div>
{% endblock %}
