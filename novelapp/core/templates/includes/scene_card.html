{# Scene card — used in chapter_detail.html #}
{# Expects: scene, novel, chapter #}
<div data-id="{{ scene.pk }}"
    class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-200">

    <div class="scene-drag-handle p-4 cursor-move">
        <div class="flex items-start justify-between mb-1">
            <span class="scene-order-label text-xs font-semibold text-indigo-600 uppercase tracking-wide">Scene {{ scene.order }}</span>
            <svg class="flex-shrink-0 h-4 w-4 text-slate-300" viewBox="0 0 16 16" fill="currentColor">
                <path d="M4 6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm8-7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
            </svg>
        </div>
        <h3 class="text-sm font-bold text-slate-900 mb-1 truncate">
            <a href="{% url 'scene_editor' novel.pk chapter.pk scene.pk %}" class="hover:text-indigo-600">{{ scene.title }}</a>
        </h3>
        <p class="text-slate-500 text-xs mb-3">{{ scene.get_status_display }}</p>
        <div class="pt-3 border-t border-slate-100 flex justify-between text-xs text-slate-500">
            <span>{{ scene.word_count }} words</span>
            <span>{{ scene.updated_at|timesince }} ago</span>
        </div>
        <div class="mt-3 flex space-x-2">
            <a href="{% url 'scene_edit' novel.pk chapter.pk scene.pk %}"
                class="px-2 py-1 text-xs font-medium text-slate-700 bg-white rounded-md hover:text-indigo-600 border border-slate-200 hover:border-indigo-300">Edit</a>
            <a href="{% url 'scene_archive' novel.pk chapter.pk scene.pk %}"
                class="px-2 py-1 text-xs font-medium text-slate-700 bg-white rounded-md hover:text-indigo-600 border border-slate-200 hover:border-indigo-300">Archive</a>
            <a href="{% url 'scene_delete' novel.pk chapter.pk scene.pk %}"
                class="px-2 py-1 text-xs font-medium text-red-600 bg-white rounded-md hover:text-red-700 border border-red-200 hover:border-red-400">Delete</a>
        </div>
    </div>

</div>{# end scene card #}
